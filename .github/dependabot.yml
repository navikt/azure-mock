version: 2
registries:
  ghcr:
    type: docker-registry
    url: ghcr.io
    username: x-access-token
    password: ${{secrets.READER_TOKEN}}
updates:
  - package-ecosystem: "maven"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
      exclude:
        - "no.nav.*"
    groups:
      dusseldorf-ktor-deps:
        patterns:
          - "*dusseldorf*"
          - "*ktor*"
      annet-deps:
        patterns:
          - "*"
        exclude-patterns:
          - "*dusseldorf*"
          - "*ktor*"
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: daily
    cooldown:
      default-days: 7
    groups:
      github:
        patterns:
        - "*"
  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: daily
    registries:
      - ghcr
